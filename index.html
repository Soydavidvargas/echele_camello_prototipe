  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">

    rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('echele_camello_a11y');
        if (saved) {
          var a11y = JSON.parse(saved);
          if (a11y.isDark) {
            document.documentElement.classList.add('dark');
          }
          if (a11y.colorBlind && a11y.colorBlind !== 'normal') {
            document.documentElement.classList.add('colorblind-' + a11y.colorBlind);
          }
          if (a11y.fontSize && a11y.fontSize !== 'normal') {
            document.documentElement.classList.add('font-size-' + a11y.fontSize);
          }
          if (a11y.highContrast) {
            document.documentElement.classList.add('high-contrast');
          }
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-[#f5f5f7] dark:bg-[#121214] text-[#1d1d1f] dark:text-[#f5f5f7] antialiased selection:bg-[#f05023]/15 selection:text-[#f05023] transition-colors duration-200">
  <!-- Inline SVG Filters for Color Blindness Accessibility -->
  <svg class="sr-only" aria-hidden="true" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Protanopia (Rojo ciego / Red-blind) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0,     0, 0
                                             0.558, 0.442, 0,     0, 0
                                             0,     0.242, 0.758, 0, 0
                                             0,     0,     0,     1, 0" />
      </filter>
      <!-- Deuteranopia (Verde ciego / Green-blind) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0,   0, 0
                                             0.7,   0.3,   0,   0, 0
                                             0,     0.3,   0.7, 0, 0
                                             0,     0,     0,   1, 0" />
      </filter>
      <!-- Tritanopia (Azul ciego / Blue-blind) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95,  0.05,  0,     0, 0
                                             0,     0.433, 0.567, 0, 0
                                             0,     0.475, 0.525, 0, 0
                                             0,     0,     0,     1, 0" />
      </filter>
    </defs>
  </svg>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
